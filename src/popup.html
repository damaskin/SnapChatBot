<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat AI Bot</title>
    <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="icons/icon32.png" alt="Snapchat AI Bot">
                <h1>Snapchat AI Bot</h1>
            </div>
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span class="status-text">Загрузка...</span>
            </div>
        </header>

        <main class="main">
            <div class="control-panel">
                <div class="toggle-section">
                    <label class="toggle-label">
                        <input type="checkbox" id="botToggle" class="toggle-input">
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">Включить бота</span>
                    </label>
                </div>

                <div class="info-section">
                    <div class="info-item">
                        <span class="info-label">Активные чаты:</span>
                        <span class="info-value" id="activeChats">0</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">ИИ агент:</span>
                        <span class="info-value" id="currentAgent">Не выбран</span>
                    </div>
                </div>

                <div class="actions-section">
                    <button class="btn btn-primary" id="openAdmin">
                        <span class="btn-icon">⚙️</span>
                        Настройки
                    </button>
                    <button class="btn btn-secondary" id="testBot">
                        <span class="btn-icon">🧪</span>
                        Тест
                    </button>
                </div>
            </div>

            <div class="test-section" id="testSection" style="display: none;">
                <h3>Тестирование бота</h3>
                <div class="test-input">
                    <input type="text" id="testMessage" placeholder="Введите тестовое сообщение...">
                    <button class="btn btn-small" id="sendTest">Отправить</button>
                </div>
                <div class="test-response" id="testResponse"></div>
            </div>

            <div class="stats-section">
                <h3>Статистика</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value" id="totalMessages">0</span>
                        <span class="stat-label">Сообщений</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="totalReplies">0</span>
                        <span class="stat-label">Ответов</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="successRate">0%</span>
                        <span class="stat-label">Успешность</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="pendingQueue">0</span>
                        <span class="stat-label">В очереди</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="lastResponse">—</span>
                        <span class="stat-label">Последний ответ</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="totalErrors">0</span>
                        <span class="stat-label">Ошибок</span>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-links">
                <a href="#" id="helpLink">Помощь</a>
                <a href="#" id="feedbackLink">Обратная связь</a>
            </div>
            <div class="version">v1.0.0</div>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
